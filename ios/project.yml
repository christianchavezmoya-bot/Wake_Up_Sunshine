name: WakeUpSunshine
options:
  bundleIdPrefix: com.wakeupsunshine
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  developmentLanguage: en
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    INFOPLIST_KEY_CFBundleDisplayName: "Wake Up Sunshine"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.lifestyle"

targets:
  WakeUpSunshine:
    type: application
    platform: iOS
    sources:
      - path: WakeUpSunshine
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wakeupsunshine.app
        INFOPLIST_FILE: WakeUpSunshine/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: WakeUpSunshine/Resources/WakeUpSunshine.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.critical-alerts: true
    dependencies:
      - package: Supabase
        url: https://github.com/supabase/supabase-swift
        from: "2.0.0"

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"